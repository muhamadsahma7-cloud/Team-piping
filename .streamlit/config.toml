# Dual theme, used by Streamlit Community Cloud. Viewers choose
# Light / Dark / System in the ⋮ menu → Settings → "Choose app theme".
# Keep in sync with streamlit_app/.streamlit/config.toml.

[theme]
base = "dark"            # default look; viewer can switch via ⋮ → Settings
font = "sans serif"
primaryColor = "#2f6feb"

[browser]
gatherUsageStats = false
