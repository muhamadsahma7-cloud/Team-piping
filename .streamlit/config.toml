# Repo-root theme, used by Streamlit Community Cloud (working dir = repo root).
# Keep in sync with streamlit_app/.streamlit/config.toml (used for local runs).

[theme]
base = "light"
primaryColor = "#1f4e79"
backgroundColor = "#f6f8fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2933"
font = "sans serif"

[browser]
gatherUsageStats = false
