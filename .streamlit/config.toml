# Repo-root theme, used by Streamlit Community Cloud (working dir = repo root).
# Keep in sync with streamlit_app/.streamlit/config.toml (used for local runs).

[theme]
base = "light"
primaryColor = "#2f6feb"
backgroundColor = "#f7f9fc"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2933"
font = "sans serif"

[browser]
gatherUsageStats = false
