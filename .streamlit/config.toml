# Repo-root theme (DARK), used by Streamlit Community Cloud.
# Keep in sync with streamlit_app/.streamlit/config.toml.
# Viewers can switch to Light in the app's ⋮ menu → Settings → Theme.

[theme]
base = "dark"
primaryColor = "#4d8dff"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1a2436"
textColor = "#e2e8f0"
font = "sans serif"

[browser]
gatherUsageStats = false
