# App theme. Change the hex values here to rebrand.
# Restart Streamlit after editing (theme is read at startup).
# Keep in sync with ../.streamlit/config.toml (repo root, used by Streamlit Cloud).

[theme]
base = "light"
primaryColor = "#2f6feb"              # vivid blue — buttons, links, active nav
backgroundColor = "#f7f9fc"           # main page — very light
secondaryBackgroundColor = "#ffffff"  # cards, sidebar panels, inputs, table header
textColor = "#1f2933"
font = "sans serif"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
