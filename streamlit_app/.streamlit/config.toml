# Dual theme. Each viewer chooses Light / Dark / System in the app's
# ⋮ menu (top-right) → Settings → "Choose app theme". Streamlit switches
# the base chrome + tables, and app.py's inject_css() follows via
# st.context.theme. Keep in sync with ../.streamlit/config.toml.

[theme]
base = "light"           # default look; viewer can switch via ⋮ → Settings
font = "sans serif"
primaryColor = "#2f6feb"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
