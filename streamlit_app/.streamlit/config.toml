# App theme. Change the hex values here to rebrand.
# Restart Streamlit after editing (theme is read at startup).

[theme]
base = "light"
primaryColor = "#1f4e79"              # corporate navy — buttons, links, active nav
backgroundColor = "#f6f8fb"           # main page — soft cool grey
secondaryBackgroundColor = "#ffffff"  # cards, sidebar, table header, inputs
textColor = "#1f2933"                 # dark slate
font = "sans serif"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
