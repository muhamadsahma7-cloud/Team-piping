# App theme — DARK. Restart Streamlit after editing.
# Keep in sync with ../.streamlit/config.toml (repo root, used by Streamlit Cloud).
# To go back to light: base="light", backgroundColor="#f7f9fc",
#   secondaryBackgroundColor="#ffffff", textColor="#1f2933"  (and swap inject_css()).

[theme]
base = "dark"
primaryColor = "#4d8dff"              # vivid blue accent
backgroundColor = "#0f172a"           # slate-900 page
secondaryBackgroundColor = "#1a2436"  # cards, sidebar, inputs, table header
textColor = "#e2e8f0"
font = "sans serif"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
